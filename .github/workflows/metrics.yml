name: Generate Metrics

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Card 1: general account stats (replaces github-readme-stats.vercel.app/api)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: output
          filename: github-metrics.svg
          config_timezone: America/Sao_Paulo

      # Card 2: top languages (replaces github-readme-stats.vercel.app/api/top-langs)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: output
          filename: github-metrics-languages.svg
          config_timezone: America/Sao_Paulo
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: percentage

      # Card 3: achievements (replaces github-profile-trophy.vercel.app)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: output
          filename: github-metrics-achievements.svg
          config_timezone: America/Sao_Paulo
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
